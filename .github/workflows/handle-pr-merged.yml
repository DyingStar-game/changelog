name: Handle PR Merged

on:
  repository_dispatch:
    types: [pr-merged]

jobs:
  append-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append the changelog entry, commit and push
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          ENTRY_EN: ${{ github.event.client_payload.entry_en }}
          ENTRY_FR: ${{ github.event.client_payload.entry_fr }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Another run (a merged PR, a preprod build of another component) may
          # push between our checkout and our push: start again from the new
          # main rather than lose this change.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              sleep $((attempt * 3))
              git fetch -q origin main
              git reset -q --hard origin/main
            fi
            python3 scripts/append_entry.py \
              --component "$COMPONENT" \
              --entry-en="$ENTRY_EN" \
              --entry-fr="$ENTRY_FR"
            # Nothing written (no entry, or a dev release with nothing unreleased)
            git diff --quiet -- '*.md' && exit 0
            python3 scripts/generate_global_json.py
            git add .
            git commit -q -m "changelog($COMPONENT): entry from $REPO#$PR_NUMBER"
            git push -q origin HEAD:main && exit 0
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
