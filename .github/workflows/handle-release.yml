name: Handle Release

on:
  repository_dispatch:
    types: [release]

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cut the release, commit and push
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          VERSION: ${{ github.event.client_payload.version }}
          DATE: ${{ github.event.client_payload.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Another run (a merged PR, a preprod build of another component) may
          # push between our checkout and our push: start again from the new
          # main rather than lose this change.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              sleep $((attempt * 3))
              git fetch -q origin main
              git reset -q --hard origin/main
            fi
            python3 scripts/cut_release.py \
              --component "$COMPONENT" \
              --version "$VERSION" \
              --date "$DATE"
            # Nothing written (no entry, or a dev release with nothing unreleased)
            git diff --quiet -- '*.md' && exit 0
            python3 scripts/generate_global_json.py
            git add .
            git commit -q -m "release($COMPONENT): cut $VERSION"
            git push -q origin HEAD:main && exit 0
          done
          echo "::error::Could not push after 5 attempts"
          exit 1
